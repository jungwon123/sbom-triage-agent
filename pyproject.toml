[project]
name = "sbom-triage"
version = "0.1.0"
description = "SBOM triage agent: NOW / NEXT / MONITOR buckets with verified remediations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "httpx>=0.27",
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=2.0"]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["docker: needs a running Docker daemon"]
