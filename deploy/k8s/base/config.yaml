# Settings that are not secret. Secrets (DATABASE_URL, TRIAGE_SESSION_SECRET, model keys, the OIDC client
# secret, SLACK_WEBHOOK_URL) live in the Secret "triage-secrets", which is created by hand and never committed:
#   kubectl -n sbom-triage create secret generic triage-secrets --from-env-file=<your file>
apiVersion: v1
kind: ConfigMap
metadata:
  name: triage-config
data:
  TRIAGE_STORE: postgres
  TRIAGE_WORKER: external            # the API only queues work; the worker Deployment runs it
  TRIAGE_SERVICE_ROOTS: /repos       # where registered services' repositories and SBOM files are mounted
  TRIAGE_AUTH: "off"                 # set to oidc with the OIDC_* settings before exposing this outside the cluster
  # The address people use. Required behind an ingress that ends TLS: the cross-site write check compares
  # the browser's Origin with it, and the sign-in callback is built from it.
  TRIAGE_PUBLIC_URL: "http://localhost:8000"
  LLM_PROVIDER: none                 # rule only until a provider and its key are set
