apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-api
  labels: {app.kubernetes.io/name: triage-api}
spec:
  replicas: 2                        # stateless: the session is a signed cookie, records are in the database
  selector:
    matchLabels: {app.kubernetes.io/name: triage-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: triage-api, triage/db-client: "true"}
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:     # put the replicas on different nodes when there are several
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: triage-api}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: db-init              # creates missing tables; an advisory lock makes concurrent starts wait their turn
          image: sbom-triage
          command: ["python", "-m", "triage", "db", "init"]
          env:                       # each container gets only the secret keys it uses
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: triage-secrets, key: DATABASE_URL}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      containers:
        - name: api
          image: sbom-triage
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: triage-config}}]
          env:                       # the API never calls the model or the alert webhook, so it holds neither key
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: triage-secrets, key: DATABASE_URL}}
            - name: TRIAGE_SESSION_SECRET
              valueFrom: {secretKeyRef: {name: triage-secrets, key: TRIAGE_SESSION_SECRET, optional: true}}
            - name: OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: triage-secrets, key: OIDC_CLIENT_SECRET, optional: true}}
          readinessProbe:            # /api/health reads the store, so a pod that lost the database stops getting traffic
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:             # only "is the process serving": a database outage must not restart every pod
            tcpSocket: {port: http}
            periodSeconds: 20
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: out, mountPath: /app/out}
            - {name: repos, mountPath: /repos, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: out, persistentVolumeClaim: {claimName: triage-out}}
        - {name: repos, persistentVolumeClaim: {claimName: triage-repos}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: triage-api
spec:
  selector: {app.kubernetes.io/name: triage-api}
  ports: [{name: http, port: 80, targetPort: http}]
