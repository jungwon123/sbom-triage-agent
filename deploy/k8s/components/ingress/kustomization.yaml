# Exposes the API through the cluster's ingress controller. Edit the host and the TLS secret name, set
# TRIAGE_PUBLIC_URL to the same https address and turn login on (TRIAGE_AUTH=oidc) before using it.
# An overlay that uses this component must set `namespace: sbom-triage` itself (see overlays/local):
# the base's namespace setting does not apply to what a component adds.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ingress.yaml
