apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          env:
            - {name: DOCKER_HOST, value: "tcp://127.0.0.1:2375"}
        - name: dind
          image: public.ecr.aws/docker/library/docker:27-dind
          # "dockerd" must come first: given only flags, the image's entrypoint adds --host=tcp://0.0.0.0:2375
          # itself, which collides with the loopback listener and would expose the daemon on the pod address.
          # --mtu: sandbox containers sit behind the pod's interface, whose MTU is below 1500 on overlay
          # networks (1450 with VXLAN). With Docker's default of 1500 large packets vanish and npm install
          # hangs until it times out. 1400 fits the common overlays; raise it only if the pod MTU is known.
          args: ["dockerd", "--host=tcp://127.0.0.1:2375", "--tls=false", "--mtu=1400"]
          env:
            - {name: DOCKER_TLS_CERTDIR, value: ""}
          securityContext: {privileged: true, runAsUser: 0, runAsNonRoot: false}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: repos, mountPath: /repos, readOnly: true}
            - {name: docker, mountPath: /var/lib/docker}
      volumes:
        - {name: docker, emptyDir: {}}
